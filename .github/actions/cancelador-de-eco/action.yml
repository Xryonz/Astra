name: Cancelador de eco
description: Prepara o compilador C travado e a biblioteca do AEC3 que o sidecar de voz usa

runs:
  using: composite

  steps:
    - name: MinGW travado
      id: cache-mingw
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: C:\aec3\mingw64
        key: mingw-winlibs-gcc16.1.0-mingwucrt14.0.0-r4

    - name: Baixar o MinGW
      if: steps.cache-mingw.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r4/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r4.zip'
        $soma = 'c406a22f8cac82559a3a1d96b62ff603f666499fb5ff4784e87b4eb6fa37dede'
        New-Item -ItemType Directory -Force -Path C:\aec3 | Out-Null
        $zip = "$env:RUNNER_TEMP\winlibs.zip"
        curl.exe --fail --location --silent --show-error --retry 3 --retry-all-errors --output $zip $url
        if ($LASTEXITCODE -ne 0) { throw 'nao consegui baixar o MinGW' }
        $vista = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
        if ($vista -ne $soma) { throw "o MinGW baixado nao confere: $vista" }
        tar -xf $zip -C C:\aec3
        Remove-Item $zip
        if (-not (Test-Path 'C:\aec3\mingw64\bin\g++.exe')) { throw 'o MinGW nao chegou inteiro' }

    - name: Biblioteca do AEC3
      id: cache-aec3
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: C:\aec3\out
        key: aec3-d0569cfa-gcc16.1.0-ndebug-v1

    - name: Compilar a biblioteca do AEC3
      if: steps.cache-aec3.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $env:PATH = "C:\aec3\mingw64\bin;$env:PATH"
        $commit = 'd0569cfa50c1858ee279d77b3fc8870be6902441'
        $soma = '1dd02894eb5f6ad53f650e906312b00b2ae57d5271fd58381e4bd88e20ff7c68'
        python -m pip install --quiet --disable-pip-version-check "meson==1.12.0"
        $tar = "$env:RUNNER_TEMP\wap.tar.gz"
        curl.exe --fail --location --silent --show-error --retry 3 --retry-all-errors --output $tar `
          "https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/$commit/webrtc-audio-processing-$commit.tar.gz"
        if ($LASTEXITCODE -ne 0) { throw 'nao consegui baixar a biblioteca do AEC3' }
        $vista = (Get-FileHash $tar -Algorithm SHA256).Hash.ToLower()
        if ($vista -ne $soma) { throw "a biblioteca baixada nao confere: $vista" }
        New-Item -ItemType Directory -Force -Path C:\aec3\src | Out-Null
        tar -xzf $tar -C C:\aec3\src --strip-components=1
        meson setup C:\aec3\build C:\aec3\src `
          --prefix=C:/aec3/out `
          --buildtype=release `
          --default-library=static `
          -Db_ndebug=true `
          -Dabseil-cpp:cpp_std=c++17
        meson compile -C C:\aec3\build
        meson install -C C:\aec3\build
        if (-not (Test-Path 'C:\aec3\out\lib\libwebrtc-audio-processing-2.a')) {
          throw 'a biblioteca do AEC3 nao foi instalada'
        }

    - name: Apontar o cgo para o AEC3
      shell: pwsh
      run: |
        'C:\aec3\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "CGO_ENABLED=1" >> $env:GITHUB_ENV
        "CGO_CPPFLAGS=-IC:/aec3/out/include/webrtc-audio-processing-2 -IC:/aec3/out/include -DWEBRTC_WIN -D_WIN32 -DNOMINMAX -D_USE_MATH_DEFINES -DWEBRTC_LIBRARY_IMPL -D__STDC_FORMAT_MACROS=1" >> $env:GITHUB_ENV
        "CGO_LDFLAGS=-LC:/aec3/out/lib -lwebrtc-audio-processing-2 -lwinmm -lstdc++ -static-libstdc++ -static-libgcc" >> $env:GITHUB_ENV
