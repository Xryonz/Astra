name: CI

on:
  push:
    branches: [main, astra-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Type-check · Test · Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build types package
        run: npm run build --workspace=@astra/types

      - name: Type-check API
        run: npm exec --workspace=@astra/api -- tsc --noEmit

      - name: Conferir estilo da API
        run: npm run lint --workspace=@astra/api

      - name: Test API
        run: npm test --workspace=@astra/api

      - name: Auditar dependencias
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Conferir acentos no texto visivel
        run: node tools/conferir-acentos.mjs


  desktop:
    name: Desktop · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache do Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-native/**/*.gradle.kts', 'mobile-native/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar o desktop e o shared
        working-directory: mobile-native
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

      - name: Conferir o Kotlin do desktop
        working-directory: mobile-native
        run: ./gradlew :desktopApp:detekt --no-daemon


  android:
    name: Android · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile-native/**/*.gradle.kts', 'mobile-native/gradle/libs.versions.toml') }}
          restore-keys: gradle-android-${{ runner.os }}-

      - name: Compilar a versao final do celular
        working-directory: mobile-native
        run: ./gradlew :app:assembleRelease --no-daemon -Pastra.android=1


  sidecar:
    name: Sidecar de voz · compilar e testar
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUST_VERSAO: '1.99.1'
    defaults:
      run:
        working-directory: sidecar-voz-rs

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Instalar o Rust fixado
        run: |
          rustup toolchain install $env:RUST_VERSAO --profile minimal --component clippy
          rustup default $env:RUST_VERSAO

      - name: Cache do Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sidecar-voz-rs/target
          key: voz-rs-${{ runner.os }}-${{ env.RUST_VERSAO }}-${{ hashFiles('sidecar-voz-rs/Cargo.lock') }}
          restore-keys: voz-rs-${{ runner.os }}-${{ env.RUST_VERSAO }}-

      - name: Preparar o libwebrtc conferido
        uses: ./.github/actions/libwebrtc-conferido

      - name: Conferir as licenças das dependências
        run: node ../tools/conferir-licencas-rust.mjs

      - name: Preparar o cargo-about conferido
        uses: ./.github/actions/cargo-about-conferido

      - name: Gerar o texto das licenças como na release
        run: cargo about generate --frozen -o "$env:RUNNER_TEMP/LICENCAS-DO-MOTOR-DE-VOZ.txt" licencas.hbs

      - name: Compilar como na release
        run: cargo build --release --locked

      - name: Testar
        run: cargo test --release --locked

      - name: Conferir com o clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings
