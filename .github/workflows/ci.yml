name: CI

on:
  push:
    branches: [main, astra-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Type-check · Test · Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build types package
        run: npm run build --workspace=@astra/types

      - name: Type-check API
        run: npm exec --workspace=@astra/api -- tsc --noEmit

      - name: Test API
        run: npm test --workspace=@astra/api

      - name: Auditar dependencias
        continue-on-error: true
        run: npm audit --audit-level=high


  desktop:
    name: Desktop · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-native/**/*.gradle.kts', 'mobile-native/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar o desktop e o shared
        working-directory: mobile-native
        run: ./gradlew :desktopApp:compileKotlin --no-daemon


  sidecar:
    name: Sidecar de voz · compilar e testar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache-dependency-path: sidecar-voz/go.sum

      - name: Testar sem o cancelador
        working-directory: sidecar-voz
        run: go test ./...

      - name: Preparar o cancelador de eco
        uses: ./.github/actions/cancelador-de-eco

      - name: Testar com o cancelador
        working-directory: sidecar-voz
        run: go test -tags aec3 ./...

      - name: Compilar como na release
        working-directory: sidecar-voz
        run: go build -tags aec3 -trimpath -buildvcs=false "-ldflags=-s -w" -o astra-voz.exe .
