name: CI

# A astra-dev entra aqui porque main = PUBLICA. Rodando so na main, a primeira
# conferencia de uma mudanca acontecia no mesmo instante em que ela ia pra todo
# mundo — e o job desktop abaixo existe justamente pra pegar deriva do :shared,
# que e mexido enquanto se trabalha no DESKTOP, ou seja: na astra-dev.
on:
  push:
    branches: [main, astra-dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    # O nome dizia "Lint" e nunca rodou lint nenhum. Nao e so cosmetico: um passo
    # que se acredita existir e nao existe e pior que um passo ausente.
    #
    # E nao da pra so ligar: o apps/web tem ESLint 9 no package.json e NENHUM
    # arquivo de configuracao (nem .eslintrc, nem eslint.config.js) — a v9 so le
    # o formato flat. O script `lint` nunca funcionou. Como o web esta congelado,
    # escrever config pra ele agora seria trabalho pra um app que ninguem edita.
    name: Type-check · Test · Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build types package
        run: npm run build --workspace=@astra/types

      - name: Type-check API
        run: npm exec --workspace=@astra/api -- tsc --noEmit

      - name: Type-check Web
        run: npm exec --workspace=@astra/web -- tsc --noEmit

      - name: Test API
        run: npm test --workspace=@astra/api

      # AVISA, nao trava (continue-on-error). CVE em dependencia transitiva
      # costuma nao ter correcao no dia em que aparece; travar o CI por isso
      # ensinaria a ignorar o vermelho, que e justamente o que nao se quer.
      # Vira bloqueio no dia em que a fila de avisos estiver zerada.
      - name: Auditar dependencias
        continue-on-error: true
        run: npm audit --audit-level=high


  # Este job existe porque o :shared e mexido enquanto se trabalha no desktop, e
  # deriva ali nao aparece ate alguem tentar empacotar. O :app cumpria esse papel
  # e ficou TRES SEMANAS quebrado sem ninguem ver — quebrou em 06/08 (AttachmentDto
  # ganhou thumbUrl na posicao 2 e o :app chamava por posicao) e de novo em 16/08
  # (PostWishRequest saiu do :shared).
  #
  # Com o Android arquivado em arquivo/android, o vigia passou a ser o :desktopApp,
  # que e a fase ativa e depende do mesmo :shared. Trocar o alvo, e nao apagar o
  # job, foi deliberado: sem ninguem compilando Kotlin aqui, a deriva volta.
  desktop:
    name: Desktop · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-native/**/*.gradle.kts', 'mobile-native/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar o desktop e o shared
        working-directory: mobile-native
        run: ./gradlew :desktopApp:compileKotlin --no-daemon
