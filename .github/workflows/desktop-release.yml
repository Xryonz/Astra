name: Desktop · publicar release

on:
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empacotar:
    runs-on: windows-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      tag: ${{ steps.versao.outputs.tag }}
      asset: ${{ steps.versao.outputs.asset }}
      existe: ${{ steps.checar.outputs.existe }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Ler a versao do gradle.properties
        id: versao
        shell: pwsh
        run: |
          $m = Select-String -Path mobile-native/gradle.properties -Pattern '^astraVersion=(.+)$'
          if (-not $m) { throw "nao achei astraVersion" }
          $v = $m.Matches[0].Groups[1].Value.Trim()
          "versao=$v"           >> $env:GITHUB_OUTPUT
          "tag=desktop-v$v"     >> $env:GITHUB_OUTPUT
          "asset=Astra-$v-win-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "versao $v"

      - name: Ja existe release desta versao?
        id: checar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          $existe = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $existe = $true }
          "existe=$existe" >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "release $tag ja existe — nada a fazer" }
          else { Write-Host "release $tag ainda nao existe — vamos publicar" }
          exit 0

      - name: Setup JDK 21
        if: steps.checar.outputs.existe == 'False'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go 1.26.5
        if: steps.checar.outputs.existe == 'False'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache-dependency-path: sidecar-voz/go.sum

      - name: Preparar o cancelador de eco
        if: steps.checar.outputs.existe == 'False'
        uses: ./.github/actions/cancelador-de-eco

      - name: Empacotar
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        working-directory: mobile-native
        run: |
          ./gradlew.bat :desktopApp:zipDistributable --no-daemon "-Pastra.canal=estavel" "-Pastra.aec3=1"

      - name: Abrir o Astra em doze condicoes diferentes
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        env:
          ASTRA_PROVAS_JAVA_BASE: -Dskiko.renderApi=SOFTWARE
        run: |
          $asset = "${{ steps.versao.outputs.asset }}"
          $zip   = "mobile-native/desktopApp/build/$asset"
          if (-not (Test-Path $zip)) { throw "zip nao encontrado em $zip" }

          $destino = Join-Path $env:RUNNER_TEMP 'astra-empacotado'
          if (Test-Path $destino) { Remove-Item -Recurse -Force $destino }
          Expand-Archive -Path $zip -DestinationPath $destino

          python --version
          if ($LASTEXITCODE -ne 0) { throw "python nao esta disponivel neste runner" }

          python -u tools/provas-de-abertura/provas.py --de $destino --tempo 120
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::o Astra reprovou em alguma condicao de abertura — publicacao abortada"
            throw "o Astra nao abriu"
          }

      - name: Entregar o pacote ao trabalho que assina
        if: steps.checar.outputs.existe == 'False'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pacote
          path: mobile-native/desktopApp/build/${{ steps.versao.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

  publicar:
    needs: empacotar
    if: needs.empacotar.outputs.existe == 'False'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/assinatura
            mobile-native/desktopApp/src/main/kotlin/app/astra/desktop/update

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Receber o pacote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pacote
          path: pacote

      - name: Assinar
        shell: pwsh
        env:
          ASTRA_CHAVE_DE_ASSINATURA: ${{ secrets.ASTRA_CHAVE_DE_ASSINATURA }}
        run: |
          $zip  = "pacote/${{ needs.empacotar.outputs.asset }}"
          if (-not (Test-Path $zip)) { throw "o pacote nao chegou em $zip" }
          $base = $zip.Substring(0, $zip.Length - 4)
          java tools/assinatura/Assinar.java $zip "${{ needs.empacotar.outputs.versao }}" "$base.manifesto" "$base.manifesto.sig"
          if ($LASTEXITCODE -ne 0) { throw "a assinatura falhou — nada foi publicado" }

      - name: Conferir a assinatura contra a chave do app
        shell: pwsh
        run: |
          $zip  = "pacote/${{ needs.empacotar.outputs.asset }}"
          $base = $zip.Substring(0, $zip.Length - 4)
          java tools/assinatura/Conferir.java "$base.manifesto" "$base.manifesto.sig" mobile-native/desktopApp/src/main/kotlin/app/astra/desktop/update/Manifesto.kt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::o segredo de assinatura e a chave embutida no app nao combinam — o app recusaria esta versao"
            throw "assinatura nao confere com o app"
          }

      - name: Publicar release + asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = "${{ needs.empacotar.outputs.tag }}"
          $asset = "${{ needs.empacotar.outputs.asset }}"
          $zip   = "pacote/$asset"
          $base  = $zip.Substring(0, $zip.Length - 4)

          $sha  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$zip.sha256"
          "$sha  $asset" | Out-File -FilePath $hashFile -Encoding ascii -NoNewline
          Write-Host "sha256: $sha"

          $arquivos = @($zip, $hashFile, "$base.manifesto", "$base.manifesto.sig")

          gh release create $tag @arquivos `
            --repo $env:GITHUB_REPOSITORY `
            --title "Astra ${{ needs.empacotar.outputs.versao }}" `
            --notes "Atualizacao automatica. O Astra baixa sozinho na proxima abertura."
          if ($LASTEXITCODE -ne 0) { throw "gh release create falhou" }

      - name: Conferir pelo caminho que o app usa
        id: conferir
        shell: pwsh
        run: |
          $tag   = "${{ needs.empacotar.outputs.tag }}"
          $asset = "${{ needs.empacotar.outputs.asset }}"
          $repo  = $env:GITHUB_REPOSITORY

          $tagVista = ''
          foreach ($tentativa in 1..15) {
            $req = [System.Net.HttpWebRequest]::Create("https://github.com/$repo/releases/latest")
            $req.AllowAutoRedirect = $false
            $req.UserAgent = 'Astra-Release-CI'
            $resp = $req.GetResponse()
            $loc = $resp.Headers['Location']; $resp.Close()
            $tagVista = ("$loc" -split '/releases/tag/')[-1]
            if ($tagVista -eq $tag) { break }
            if ($tentativa -lt 15) { Start-Sleep -Seconds 10 }
          }

          $zipUrl = "https://github.com/$repo/releases/download/$tag/$asset"
          $baseUrl = $zipUrl.Substring(0, $zipUrl.Length - 4)
          $ok = try {
            $g = [System.Net.HttpWebRequest]::Create($zipUrl); $g.UserAgent = 'Astra-Release-CI'; $g.AddRange(0, 0)
            $gr = $g.GetResponse(); $codigo = [int]$gr.StatusCode; $gr.Close()
            $codigo -eq 206 -or $codigo -eq 200
          } catch { $false }

          $pequenoBaixa = {
            param($url)
            try {
              $h = [System.Net.HttpWebRequest]::Create($url); $h.UserAgent = 'Astra-Release-CI'
              $hr = $h.GetResponse(); $c = [int]$hr.StatusCode; $hr.Close()
              $c -eq 200
            } catch { $false }
          }
          $okHash       = & $pequenoBaixa "$zipUrl.sha256"
          $okManifesto  = & $pequenoBaixa "$baseUrl.manifesto"
          $okAssinatura = & $pequenoBaixa "$baseUrl.manifesto.sig"

          $arquivosOk = $ok -and $okHash -and $okManifesto -and $okAssinatura
          "arquivosOk=$arquivosOk" >> $env:GITHUB_OUTPUT

          Write-Host "latest aponta pra : $tagVista (esperado $tag)"
          Write-Host "zip acessivel     : $ok"
          Write-Host "sha256 acessivel  : $okHash"
          Write-Host "manifesto         : $okManifesto"
          Write-Host "assinatura        : $okAssinatura"

          if (-not $arquivosOk) { throw "PUBLICOU MAS ALGUM ARQUIVO NAO BAIXA" }
          if ($tagVista -ne $tag) {
            Write-Host "::error::o ponteiro /releases/latest ainda aponta pra $tagVista"
            Write-Host "os arquivos estao no lugar, entao a release FICA — o ponteiro costuma se acertar sozinho"
            throw "PONTEIRO ATRASADO — confira em alguns minutos antes de mexer"
          }
          Write-Host "OK — os amigos recebem na proxima abertura do Astra."

      - name: Desfazer publicacao que falhou
        if: failure() && steps.conferir.outputs.arquivosOk != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.empacotar.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "nada a desfazer — a release $tag nao chegou a ser criada"
            exit 0
          }
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { throw "falhei ao apagar a release $tag" }
          Write-Host "release $tag apagada — ninguem recebe a versao quebrada"
