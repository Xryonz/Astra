name: Desktop · publicar release

# AUTO-UPDATE SEM PASSO MANUAL.
#
# O gatilho e a PROPRIA VERSAO: sobe pra main com o astraVersion bumpado e este
# fluxo empacota, publica a release e sobe o asset com o nome exato que o
# UpdateService espera. Nao ha tag pra criar, nem zip pra arrastar, nem nome pra
# digitar — que era onde tudo quebrava: a ultima release publicada na mao tinha a
# tag desktop-v0.1.8 com o asset chamado "0.1.9.zip", e o app procurava
# Astra-0.1.8-win-x64.zip. Resultado: 404, zero downloads, e o dono mandando o zip
# pros amigos por 28 versoes seguidas.
#
# Se a versao NAO mudou, o fluxo sai sozinho no comeco (nao republica nada).

on:
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - '.github/workflows/desktop-release.yml'
  # Botao manual, pra reempacotar sem precisar de um commit novo.
  workflow_dispatch:

permissions:
  contents: write   # criar release e subir asset

jobs:
  publicar:
    # Windows obrigatorio: o jpackage so gera app-image do Windows RODANDO no
    # Windows, e o ffmpeg empacotado e o ddagrab (DXGI), que so existe aqui.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ler a versao do gradle.properties
        id: versao
        shell: pwsh
        run: |
          # Fonte UNICA da versao. Ninguem digita numero de versao neste fluxo.
          # Saiu do desktopApp/build.gradle.kts quando o APK do Android passou a
          # ser publicado junto. O Android foi arquivado depois, mas a fonte fica
          # aqui: e o unico lugar do repositorio que diz a versao em voz alta.
          $m = Select-String -Path mobile-native/gradle.properties -Pattern '^astraVersion=(.+)$'
          if (-not $m) { throw "nao achei astraVersion" }
          $v = $m.Matches[0].Groups[1].Value.Trim()
          "versao=$v"           >> $env:GITHUB_OUTPUT
          "tag=desktop-v$v"     >> $env:GITHUB_OUTPUT
          "asset=Astra-$v-win-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "versao $v"

      - name: Ja existe release desta versao?
        id: checar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          $existe = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $existe = $true }
          "existe=$existe" >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "release $tag ja existe — nada a fazer" }
          else { Write-Host "release $tag ainda nao existe — vamos publicar" }
          # "Nao existe" e uma RESPOSTA, nao um erro: o `gh release view` sai com
          # codigo != 0 nesse caso, e o pwsh do Actions reprova o passo inteiro pelo
          # ultimo exit code. Sem este exit 0 explicito, o fluxo morria justamente
          # quando havia algo pra publicar (e passava quando nao havia).
          exit 0

      - name: Setup JDK 21
        if: steps.checar.outputs.existe == 'False'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # VERSAO FIXA, DE PROPOSITO — nao trocar por "stable".
      #
      # O astra-voz.exe tem 27,76 MB crus / 9,58 MB comprimidos, e a atualizacao
      # incremental so reaproveita arquivo cujo CRC bate com o que ja esta
      # instalado. Binario de Go diferente = 9,58 MB baixados a toa, que eram 64%
      # de TODO o delta de uma atualizacao (15,0 MB medidos no 1.0.22 -> 1.0.23).
      #
      # O `go build` ja usa -trimpath e agora -buildvcs=false, entao o binario e
      # reproduzivel DESDE QUE o compilador seja o mesmo. Sem este passo, o Go e o
      # que vier na imagem do runner naquela semana — e quando a imagem trocar de
      # versao, o sidecar volta a ser reconstruido diferente sem ninguem ter
      # tocado nele.
      #
      # Manter igual ao `go` do sidecar-voz/go.mod.
      - name: Setup Go 1.26.5
        if: steps.checar.outputs.existe == 'False'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: sidecar-voz/go.sum

      # O ffmpeg (ddagrab) e grande e fica FORA do git — cachear evita rebaixar
      # ~100MB a cada release.
      - name: Cache do ffmpeg
        if: steps.checar.outputs.existe == 'False'
        uses: actions/cache@v4
        with:
          path: mobile-native/desktopApp/appResources/windows/ffmpeg.exe
          key: ffmpeg-ddagrab-win64-v1

      - name: Empacotar
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        working-directory: mobile-native
        run: |
          # Sem -Pastra.distDir aqui: aquele desvio existe so porque o repo do dono
          # mora num caminho com acento, e o jpackage nao engole. No runner o
          # caminho e limpo, entao o build padrao serve.
          #
          # -Pastra.canal=estavel esconde os diagnosticos de voz. O default e "dev":
          # se um dia essa flag cair fora daqui, o build publicado mostra diagnostico
          # a mais, que e o erro barato. O caro seria o inverso.
          #
          # As ASPAS sao obrigatorias e nao sao estilo. Sem elas o pwsh parte o
          # argumento no ponto e o Gradle recebe ".canal=estavel" como se fosse
          # nome de tarefa: "Task '.canal=estavel' not found". Todo -Pchave.com.ponto
          # que passar por aqui precisa vir entre aspas.
          ./gradlew.bat :desktopApp:zipDistributable --no-daemon "-Pastra.canal=estavel"

      # O Android foi arquivado na branch arquivo/android em 06/09/2026, entao nao
      # ha mais o que compilar aqui. O APK continua indo nas releases porque o
      # popup de download oferece Windows e Android, e um botao que cai numa
      # release sem APK e pior que botao nenhum.
      #
      # O que vai e o ULTIMO APK que foi realmente compilado, com o NOME DA VERSAO
      # DELE — nao renomeado para a versao nova. Renomear faria a pessoa baixar um
      # binario velho achando que e o atual; o nome preserva a verdade sem tirar o
      # download de quem ja usa o Android.
      - name: Buscar o APK congelado
        if: steps.checar.outputs.existe == 'False'
        id: apk
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "achou=False" >> $env:GITHUB_OUTPUT
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 60 --json tagName `
            | ConvertFrom-Json | ForEach-Object { $_.tagName }
          foreach ($t in $tags) {
            $nomes = (gh release view $t --repo $env:GITHUB_REPOSITORY --json assets `
              | ConvertFrom-Json).assets.name
            $alvo = $nomes | Where-Object { $_ -like "Astra-*-android.apk" } | Select-Object -First 1
            if (-not $alvo) { continue }
            New-Item -ItemType Directory -Force -Path apk-congelado | Out-Null
            gh release download $t --repo $env:GITHUB_REPOSITORY `
              --pattern "$alvo" --pattern "$alvo.sha256" --dir apk-congelado
            if ($LASTEXITCODE -ne 0) { throw "falhei ao baixar $alvo de $t" }
            "achou=True"  >> $env:GITHUB_OUTPUT
            "nome=$alvo"  >> $env:GITHUB_OUTPUT
            Write-Host "APK congelado: $alvo (da release $t)"
            break
          }

      - name: Publicar release + asset
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = "${{ steps.versao.outputs.tag }}"
          $asset = "${{ steps.versao.outputs.asset }}"
          $zip   = "mobile-native/desktopApp/build/$asset"
          if (-not (Test-Path $zip)) {
            Write-Host "procurando o zip..."
            Get-ChildItem mobile-native -Recurse -Filter "Astra-*-win-x64.zip" | ForEach-Object { $_.FullName }
            throw "zip nao encontrado em $zip"
          }
          # SHA-256 ao lado do zip. O app baixa este arquivo e confere ANTES de
          # trocar a pasta da versao — antes ele so olhava o Content-Length, que
          # pega download truncado mas nao pega arquivo trocado.
          # Formato do `sha256sum` ("<hash>  <nome>") porque e o que o cliente le.
          $sha  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$zip.sha256"
          "$sha  $asset" | Out-File -FilePath $hashFile -Encoding ascii -NoNewline
          Write-Host "sha256: $sha"

          $arquivos = @($zip, $hashFile)

          # O APK congelado entra como veio da release anterior: mesmo arquivo,
          # mesmo nome, mesmo hash. Nao ha o que recalcular — recalcular seria
          # justamente a chance de trocar o nome sem querer.
          if ("${{ steps.apk.outputs.achou }}" -eq "True") {
            $apk = "apk-congelado/${{ steps.apk.outputs.nome }}"
            if (-not (Test-Path $apk)) { throw "apk congelado sumiu em $apk" }
            $arquivos += $apk
            if (Test-Path "$apk.sha256") { $arquivos += "$apk.sha256" }
          }

          gh release create $tag @arquivos `
            --repo $env:GITHUB_REPOSITORY `
            --title "Astra ${{ steps.versao.outputs.versao }}" `
            --notes "Atualizacao automatica. O Astra baixa sozinho na proxima abertura."
          if ($LASTEXITCODE -ne 0) { throw "gh release create falhou" }

      # Publicar nao basta: o que importa e o APP achar. Ele nao usa a API do
      # GitHub — le o 302 de /releases/latest, tira a tag e monta a URL do zip por
      # convencao. Entao a conferencia tem que passar por esse mesmo caminho.
      - name: Conferir pelo caminho que o app usa
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        run: |
          $tag   = "${{ steps.versao.outputs.tag }}"
          $asset = "${{ steps.versao.outputs.asset }}"
          $repo  = $env:GITHUB_REPOSITORY

          # HttpWebRequest e nao Invoke-WebRequest. As mesmas tres armadilhas que
          # ja tinham derrubado o tools/publicar-release.ps1 estavam AQUI tambem —
          # este passo nunca conferiu nada, so falhava:
          #
          #  1. `-MaximumRedirection 0` LANCA "maximum redirection count has been
          #     exceeded" em vez de devolver o 302. Era o erro desta execucao.
          #  2. `-UseBasicParsing` devolve .Headers.Location VAZIO, calado — pior
          #     que falhar, porque a conferencia "passa" sem conferir.
          #  3. O CDN do GitHub responde 404 a HEAD de asset valido, de vez em
          #     quando. Por isso o teste e um GET de UM BYTE (espera 206).
          #
          # E o ponteiro /releases/latest demora segundos pra apontar pra tag nova:
          # por isso tenta 5x em vez de um Start-Sleep chutado.
          $tagVista = ''
          foreach ($tentativa in 1..5) {
            $req = [System.Net.HttpWebRequest]::Create("https://github.com/$repo/releases/latest")
            $req.AllowAutoRedirect = $false
            $req.UserAgent = 'Astra-Release-CI'
            $resp = $req.GetResponse()
            $loc = $resp.Headers['Location']; $resp.Close()
            $tagVista = ("$loc" -split '/releases/tag/')[-1]
            if ($tagVista -eq $tag) { break }
            if ($tentativa -lt 5) { Start-Sleep -Seconds 4 }
          }

          $zipUrl = "https://github.com/$repo/releases/download/$tag/$asset"
          $ok = try {
            $g = [System.Net.HttpWebRequest]::Create($zipUrl); $g.UserAgent = 'Astra-Release-CI'; $g.AddRange(0, 0)
            $gr = $g.GetResponse(); $codigo = [int]$gr.StatusCode; $gr.Close()
            $codigo -eq 206 -or $codigo -eq 200
          } catch { $false }

          # O hash tem que estar la tambem: sem ele o app aceita o zip sem
          # conferir, e o motivo de nao conferir seria invisivel.
          $okHash = try {
            $h = [System.Net.HttpWebRequest]::Create("$zipUrl.sha256"); $h.UserAgent = 'Astra-Release-CI'
            $hr = $h.GetResponse(); $c2 = [int]$hr.StatusCode; $hr.Close()
            $c2 -eq 200
          } catch { $false }

          Write-Host "latest aponta pra: $tagVista (esperado $tag)"
          Write-Host "zip acessivel    : $ok"
          Write-Host "sha256 acessivel : $okHash"
          if ($tagVista -ne $tag -or -not $ok -or -not $okHash) { throw "PUBLICOU MAS O APP NAO VAI ACHAR" }
          Write-Host "OK — os amigos recebem na proxima abertura do Astra."
