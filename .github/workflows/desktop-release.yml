name: Desktop · publicar release

on:
  push:
    branches: [main]
    paths:
      - 'mobile-native/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empacotar:
    runs-on: windows-latest
    env:
      RUST_VERSAO: '1.99.1'
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      tag: ${{ steps.versao.outputs.tag }}
      asset: ${{ steps.versao.outputs.asset }}
      existe: ${{ steps.checar.outputs.existe }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Ler a versao do gradle.properties
        id: versao
        shell: pwsh
        run: |
          $m = Select-String -Path mobile-native/gradle.properties -Pattern '^astraVersion=(.+)$'
          if (-not $m) { throw "nao achei astraVersion" }
          $v = $m.Matches[0].Groups[1].Value.Trim()
          "versao=$v"           >> $env:GITHUB_OUTPUT
          "tag=desktop-v$v"     >> $env:GITHUB_OUTPUT
          "asset=Astra-$v-win-x64.zip" >> $env:GITHUB_OUTPUT
          Write-Host "versao $v"

      - name: Ja existe release desta versao?
        id: checar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          $existe = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $existe = $true }
          "existe=$existe" >> $env:GITHUB_OUTPUT
          if ($existe) { Write-Host "release $tag ja existe — nada a fazer" }
          else { Write-Host "release $tag ainda nao existe — vamos publicar" }
          exit 0

      - name: Setup JDK 25
        if: steps.checar.outputs.existe == 'False'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Instalar o Rust fixado
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSAO --profile minimal
          rustup default $env:RUST_VERSAO

      - name: Preparar o libwebrtc conferido
        id: libwebrtc
        if: steps.checar.outputs.existe == 'False'
        uses: ./.github/actions/libwebrtc-conferido

      - name: Preparar o cargo-about conferido
        if: steps.checar.outputs.existe == 'False'
        uses: ./.github/actions/cargo-about-conferido

      - name: Por as licencas do motor no pacote
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        working-directory: sidecar-voz-rs
        run: |
          $destino = '../mobile-native/desktopApp/appResources/windows'
          New-Item -ItemType Directory -Force -Path $destino | Out-Null
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo fetch falhou' }
          cargo about generate --frozen -o "$destino/LICENCAS-DO-MOTOR-DE-VOZ.txt" licencas.hbs
          if ($LASTEXITCODE -ne 0) { throw 'cargo about falhou: alguma licenca fora da lista do about.toml?' }
          Copy-Item "$env:LK_CUSTOM_WEBRTC/LICENSE.md" "$destino/LICENCAS-DO-LIBWEBRTC.md"
          Copy-Item src/tela/LICENCA-moq-video.txt $destino

      - name: Juntar o material da LGPL
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        env:
          ETIQUETA_DO_LIBWEBRTC: ${{ steps.libwebrtc.outputs.etiqueta }}
          ZIP_DO_LIBWEBRTC: ${{ steps.libwebrtc.outputs.zip }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $etiquetaDocumentada = 'webrtc-a545de4'
          $webrtcSdk = 'a545de45259b47dfac5f3635863e47cb601f1bb2'
          $rustSdks = '524123ee0069e8c01342c90978ad0dd5e4c58275'
          $ffmpeg = 'ad41607c61898cf7150e0fb20fe4bbabd44922a3'
          $etiqueta = $env:ETIQUETA_DO_LIBWEBRTC
          if ($etiqueta -ne $etiquetaDocumentada) {
            throw "o libwebrtc mudou para $($etiqueta): atualize aqui a revisao do FFmpeg (DEPS do webrtc-sdk/webrtc) e os commits de origem"
          }
          $versao = $env:VERSAO
          $material = "$env:RUNNER_TEMP\material-lgpl"
          New-Item -ItemType Directory -Force -Path $material | Out-Null
          $libwebrtc = "lib$etiqueta-win-x64.zip"
          Copy-Item $env:ZIP_DO_LIBWEBRTC "$material\$libwebrtc"
          $somaDoLibwebrtc = (Get-FileHash "$material\$libwebrtc" -Algorithm SHA256).Hash.ToLower()
          $curto = $ffmpeg.Substring(0, 8)
          $fonteDoFfmpeg = "ffmpeg-$curto-fonte.tar.gz"
          $git = "$env:RUNNER_TEMP\ffmpeg-git"
          git init -q $git
          git -C $git fetch -q --depth 1 https://chromium.googlesource.com/chromium/third_party/ffmpeg $ffmpeg
          if ($LASTEXITCODE -ne 0) { throw 'nao consegui buscar o codigo-fonte do FFmpeg' }
          if ((git -C $git rev-parse FETCH_HEAD) -ne $ffmpeg) { throw 'o FFmpeg buscado nao e a revisao fixada' }
          git -C $git archive --format=tar.gz --prefix="ffmpeg-$curto/" -o "$material\$fonteDoFfmpeg" FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'nao consegui empacotar o codigo-fonte do FFmpeg' }
          $instrucoes = @"
          Astra $($versao): como refazer o motor de voz com outra versão do FFmpeg

          O motor de voz e tela do Astra (app\resources\astra-voz.exe, na pasta do Astra) leva
          dentro o libwebrtc, e o libwebrtc leva o FFmpeg, ligado de forma estática e distribuído
          sob a GNU Lesser General Public License 2.1. O texto da licença está em
          app\resources\LICENCAS-DO-LIBWEBRTC.md, na seção do ffmpeg. A LGPL garante o direito de
          trocar o FFmpeg e refazer o motor, e esta versão traz, ao lado do pacote, o que é
          preciso para isso:

          - $($libwebrtc): o libwebrtc exatamente como entrou no motor (lib\webrtc.lib, os
            cabeçalhos, o args.gn da compilação e as licenças). É a publicação $etiqueta da
            LiveKit (https://github.com/livekit/rust-sdks/releases/tag/$etiqueta), compilada a
            partir de https://github.com/webrtc-sdk/webrtc no commit $webrtcSdk,
            com os ajustes de webrtc-sys/libwebrtc de https://github.com/livekit/rust-sdks no
            commit $rustSdks.
            SHA-256: $somaDoLibwebrtc
          - $($fonteDoFfmpeg): o código-fonte do FFmpeg que está dentro do webrtc.lib, na
            revisão $ffmpeg de
            https://chromium.googlesource.com/chromium/third_party/ffmpeg
          - o código-fonte do Astra desta versão, na etiqueta desktop-v$versao de
            https://github.com/Xryonz/Astra. O motor fica em sidecar-voz-rs.

          Para refazer o motor:

          1. Instale o Rust $env:RUST_VERSAO e as ferramentas de C++ do Visual Studio (MSVC).
          2. Monte um webrtc.lib com o FFmpeg modificado: compile o libwebrtc com o mesmo
             args.gn, como em webrtc-sys\libwebrtc\build_windows.cmd do rust-sdks, ou troque os
             objetos do FFmpeg dentro de lib\webrtc.lib com o lib.exe do Visual Studio.
          3. Aponte a variável de ambiente LK_CUSTOM_WEBRTC para a pasta win-x64-release que
             contém o novo lib\webrtc.lib.
          4. Na pasta sidecar-voz-rs do código do Astra, rode: cargo build --release --locked
          5. Troque app\resources\astra-voz.exe, na pasta do Astra, pelo
             target\release\astra-voz.exe gerado. A próxima atualização do Astra devolve o motor
             publicado.
          "@
          Set-Content -Path "$material\COMO-REFAZER-O-MOTOR.txt" -Value $instrucoes -Encoding utf8
          Get-ChildItem $material | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Empacotar
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        working-directory: mobile-native
        run: |
          ./gradlew.bat :desktopApp:zipDistributable --no-daemon "-Pastra.canal=estavel"

      - name: Conferir que o pacote leva o motor em Rust e as licencas dele
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        run: |
          $zip = Resolve-Path "mobile-native/desktopApp/build/${{ steps.versao.outputs.asset }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pacote = [IO.Compression.ZipFile]::OpenRead($zip)
          $lerUnico = {
            param($nome)
            $achados = @($pacote.Entries | Where-Object { $_.Name -eq $nome })
            if ($achados.Count -ne 1) { throw "esperava um $nome no pacote e achei $($achados.Count)" }
            $leitor = New-Object IO.StreamReader($achados[0].Open(), [Text.Encoding]::GetEncoding(28591))
            try { $leitor.ReadToEnd() } finally { $leitor.Dispose() }
          }
          try {
            $motor = & $lerUnico 'astra-voz.exe'
            $licencasDoMotor = & $lerUnico 'LICENCAS-DO-MOTOR-DE-VOZ.txt'
            $licencasDoLibwebrtc = & $lerUnico 'LICENCAS-DO-LIBWEBRTC.md'
            $licencaDoMoq = & $lerUnico 'LICENCA-moq-video.txt'
          } finally { $pacote.Dispose() }
          if (-not $motor.Contains('libavcodec')) { throw 'o astra-voz.exe do pacote nao e o motor em Rust' }
          if (-not $licencasDoMotor.Contains('- livekit 0.')) { throw 'as licencas do motor nao listam o livekit' }
          if (-not $licencasDoLibwebrtc.Contains('# ffmpeg')) { throw 'as licencas do libwebrtc nao trazem a do ffmpeg' }
          if (-not $licencaDoMoq.Contains('Luke Curley')) { throw 'a licenca do moq-video nao e a esperada' }
          Write-Host "astra-voz.exe do pacote: motor em Rust ($($motor.Length) bytes), com as licencas"

      - name: Abrir o Astra em doze condicoes diferentes
        if: steps.checar.outputs.existe == 'False'
        shell: pwsh
        env:
          ASTRA_PROVAS_JAVA_BASE: -Dskiko.renderApi=SOFTWARE
        run: |
          $asset = "${{ steps.versao.outputs.asset }}"
          $zip   = "mobile-native/desktopApp/build/$asset"
          if (-not (Test-Path $zip)) { throw "zip nao encontrado em $zip" }

          $destino = Join-Path $env:RUNNER_TEMP 'astra-empacotado'
          if (Test-Path $destino) { Remove-Item -Recurse -Force $destino }
          Expand-Archive -Path $zip -DestinationPath $destino

          python --version
          if ($LASTEXITCODE -ne 0) { throw "python nao esta disponivel neste runner" }

          python -u tools/provas-de-abertura/provas.py --de $destino --tempo 120
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::o Astra reprovou em alguma condicao de abertura — publicacao abortada"
            throw "o Astra nao abriu"
          }

      - name: Entregar o pacote ao trabalho que assina
        if: steps.checar.outputs.existe == 'False'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pacote
          path: mobile-native/desktopApp/build/${{ steps.versao.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

      - name: Entregar o material da LGPL ao trabalho que publica
        if: steps.checar.outputs.existe == 'False'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: material-lgpl
          path: ${{ runner.temp }}/material-lgpl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publicar:
    needs: empacotar
    if: needs.empacotar.outputs.existe == 'False' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/assinatura
            mobile-native/desktopApp/src/main/kotlin/app/astra/desktop/update

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Receber o pacote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pacote
          path: pacote

      - name: Receber o material da LGPL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: material-lgpl
          path: material-lgpl

      - name: Assinar
        shell: pwsh
        env:
          ASTRA_CHAVE_DE_ASSINATURA: ${{ secrets.ASTRA_CHAVE_DE_ASSINATURA }}
        run: |
          $zip  = "pacote/${{ needs.empacotar.outputs.asset }}"
          if (-not (Test-Path $zip)) { throw "o pacote nao chegou em $zip" }
          $base = $zip.Substring(0, $zip.Length - 4)
          java tools/assinatura/Assinar.java $zip "${{ needs.empacotar.outputs.versao }}" "$base.manifesto" "$base.manifesto.sig"
          if ($LASTEXITCODE -ne 0) { throw "a assinatura falhou — nada foi publicado" }

      - name: Conferir a assinatura contra a chave do app
        shell: pwsh
        run: |
          $zip  = "pacote/${{ needs.empacotar.outputs.asset }}"
          $base = $zip.Substring(0, $zip.Length - 4)
          java tools/assinatura/Conferir.java "$base.manifesto" "$base.manifesto.sig" mobile-native/desktopApp/src/main/kotlin/app/astra/desktop/update/Manifesto.kt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::o segredo de assinatura e a chave embutida no app nao combinam — o app recusaria esta versao"
            throw "assinatura nao confere com o app"
          }

      - name: Publicar release + asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = "${{ needs.empacotar.outputs.tag }}"
          $asset = "${{ needs.empacotar.outputs.asset }}"
          $zip   = "pacote/$asset"
          $base  = $zip.Substring(0, $zip.Length - 4)

          $sha  = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$zip.sha256"
          "$sha  $asset" | Out-File -FilePath $hashFile -Encoding ascii -NoNewline
          Write-Host "sha256: $sha"

          $material = @(Get-ChildItem material-lgpl -File | ForEach-Object { $_.FullName })
          if ($material.Count -ne 3) { throw "esperava 3 arquivos do material da LGPL e chegaram $($material.Count)" }
          $arquivos = @($zip, $hashFile, "$base.manifesto", "$base.manifesto.sig") + $material

          gh release create $tag @arquivos `
            --repo $env:GITHUB_REPOSITORY `
            --title "Astra ${{ needs.empacotar.outputs.versao }}" `
            --notes "Atualizacao automatica. O Astra baixa sozinho na proxima abertura."
          if ($LASTEXITCODE -ne 0) { throw "gh release create falhou" }

      - name: Conferir pelo caminho que o app usa
        id: conferir
        shell: pwsh
        run: |
          $tag   = "${{ needs.empacotar.outputs.tag }}"
          $asset = "${{ needs.empacotar.outputs.asset }}"
          $repo  = $env:GITHUB_REPOSITORY

          $tagVista = ''
          foreach ($tentativa in 1..15) {
            $req = [System.Net.HttpWebRequest]::Create("https://github.com/$repo/releases/latest")
            $req.AllowAutoRedirect = $false
            $req.UserAgent = 'Astra-Release-CI'
            $resp = $req.GetResponse()
            $loc = $resp.Headers['Location']; $resp.Close()
            $tagVista = ("$loc" -split '/releases/tag/')[-1]
            if ($tagVista -eq $tag) { break }
            if ($tentativa -lt 15) { Start-Sleep -Seconds 10 }
          }

          $zipUrl = "https://github.com/$repo/releases/download/$tag/$asset"
          $baseUrl = $zipUrl.Substring(0, $zipUrl.Length - 4)
          $ok = try {
            $g = [System.Net.HttpWebRequest]::Create($zipUrl); $g.UserAgent = 'Astra-Release-CI'; $g.AddRange(0, 0)
            $gr = $g.GetResponse(); $codigo = [int]$gr.StatusCode; $gr.Close()
            $codigo -eq 206 -or $codigo -eq 200
          } catch { $false }

          $pequenoBaixa = {
            param($url)
            try {
              $h = [System.Net.HttpWebRequest]::Create($url); $h.UserAgent = 'Astra-Release-CI'
              $hr = $h.GetResponse(); $c = [int]$hr.StatusCode; $hr.Close()
              $c -eq 200
            } catch { $false }
          }
          $okHash       = & $pequenoBaixa "$zipUrl.sha256"
          $okManifesto  = & $pequenoBaixa "$baseUrl.manifesto"
          $okAssinatura = & $pequenoBaixa "$baseUrl.manifesto.sig"

          $arquivosOk = $ok -and $okHash -and $okManifesto -and $okAssinatura
          "arquivosOk=$arquivosOk" >> $env:GITHUB_OUTPUT

          Write-Host "latest aponta pra : $tagVista (esperado $tag)"
          Write-Host "zip acessivel     : $ok"
          Write-Host "sha256 acessivel  : $okHash"
          Write-Host "manifesto         : $okManifesto"
          Write-Host "assinatura        : $okAssinatura"

          if (-not $arquivosOk) { throw "PUBLICOU MAS ALGUM ARQUIVO NAO BAIXA" }
          if ($tagVista -ne $tag) {
            Write-Host "::error::o ponteiro /releases/latest ainda aponta pra $tagVista"
            Write-Host "os arquivos estao no lugar, entao a release FICA — o ponteiro costuma se acertar sozinho"
            throw "PONTEIRO ATRASADO — confira em alguns minutos antes de mexer"
          }
          Write-Host "OK — os amigos recebem na proxima abertura do Astra."

      - name: Desfazer publicacao que falhou
        if: failure() && steps.conferir.outputs.arquivosOk != 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.empacotar.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "nada a desfazer — a release $tag nao chegou a ser criada"
            exit 0
          }
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { throw "falhei ao apagar a release $tag" }
          Write-Host "release $tag apagada — ninguem recebe a versao quebrada"
