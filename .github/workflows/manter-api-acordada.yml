name: manter a API acordada

on:
  schedule:
    - cron: '*/10 0-4,12-23 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: acordar a API
        run: |
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            https://astra-kwzc.onrender.com/live || echo 000)
          echo "/live respondeu $codigo"
          case "$codigo" in
            200|503) exit 0 ;;
            *) echo "::warning::a API nao respondeu ($codigo)"; exit 1 ;;
          esac
