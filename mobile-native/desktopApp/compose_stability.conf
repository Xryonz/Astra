// Config de estabilidade do compilador Compose (desktop).
// Classes imutaveis que o compilador marca como "unstable" so por estarem FORA do
// modulo Compose (os DTOs vivem no :shared, sem o plugin) ou por conterem List<>.
// Sao data classes desserializadas e NUNCA mutadas -> declara-las estaveis faz o
// Compose decidir skip por equals ESTRUTURAL (conteudo) em vez de === (instancia).
// Efeito: em listas (chat, amigos, notificacoes, busca), itens recriados com o
// mesmo conteudo param de recompor. Zero mudanca de runtime.

// Todos os DTOs de rede compartilhados.
app.astra.mobile.core.network.dto.*

// Data classes do desktop que viram item de lista.
app.astra.desktop.shell.ChatMessage
app.astra.desktop.shell.PendingFile

// As colecoes SO-LEITURA da stdlib. O compilador as trata como instaveis porque a
// interface List nao promete imutabilidade -- alguem pode passar uma ArrayList e
// muta-la por baixo. Aqui isso nao acontece: o estado que chega na UI sai sempre de
// _state.update { it.copy(...) } com lista NOVA de .map/.filter/+, e as unicas
// estruturas mutadas no lugar (CacheDeConversas, typingJobs) nunca viram parametro
// de composable. As mutaveis ficam de fora de proposito -- MutableList mutada por
// baixo com esta linha ligada seria bug invisivel.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// Os SERVICOS de vida longa que descem por parametro. A referencia deles nunca
// muda -- sao instancia unica do Koin, criada uma vez e mantida pela sessao --
// e todo estado mutavel deles sai por StateFlow, que o composavel coleta. Entao
// comparar por identidade e sempre certo, e sem estas linhas cada um deles
// bastava aparecer na assinatura para tornar o composavel nao-skippavel.
// A Bandeja fica DE FORA: ela embrulha a bandeja do AWT, que tem estado mutavel
// proprio e nao avisa ninguem quando muda.
app.astra.desktop.prefs.DesktopPrefs
app.astra.desktop.update.UpdateService
app.astra.desktop.shell.ChatVm
app.astra.desktop.voice.CallNaSala
app.astra.desktop.xp.XpStore
app.astra.desktop.auth.AuthRepository
