org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
astraVersion=1.0.26
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# O path do repo ja teve acento e o AGP bloqueia non-ASCII no Windows por
# default. O acento acabou (a pasta virou CodigosELoucuras), entao a flag hoje
# e inerte — fica so pro caso de o repo voltar pra um caminho com acento.
android.overridePathCheck=true
# AGP 9: mantem o KGP standalone (kotlin.android) + DSL antigo em vez do "Kotlin
# embutido", pra nao reescrever a fiacao compose/serialization/ksp. Temporario:
# a AGP 10 remove esses opt-outs (migrar pro built-in Kotlin ate la).
android.builtInKotlin=false
# newDsl=false tambem reativa a API legada de variantes (applicationVariants),
# usada pra renomear o APK -> Astra.apk.
android.newDsl=false
