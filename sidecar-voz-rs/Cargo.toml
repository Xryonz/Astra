[package]
name = "astra-voz"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "astra-voz"
path = "src/main.rs"

[dependencies]
livekit = { version = "=0.9.7", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
