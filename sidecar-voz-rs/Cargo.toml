[package]
name = "astra-voz"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "astra-voz"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
